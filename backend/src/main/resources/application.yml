spring:
  application:
    name: hash-anchor-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hashanchor
    username: hashanchor
    password: hashanchor

  jpa:
    # Flyway owns the schema; Hibernate only checks its entity mappings
    # against it at startup and fails fast on a mismatch. It never creates
    # or alters tables itself — that would let the two get out of sync.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Wait for every in-sync replica to ack, not just the partition leader.
      # With a single broker in dev this is just "the leader," but it's the
      # right default to carry into a real cluster later.
      acks: all
    consumer:
      # Consumers sharing a group-id split a topic's partitions between
      # them, and the group's committed offsets record how far it has got.
      # A second, independent consumer of records.submitted would use a
      # different group-id and see every message too.
      group-id: hash-anchor-anchoring
      # Where to start when this group has no committed offset yet (first
      # run): the beginning of the topic, so nothing published before the
      # consumer existed is skipped.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit each message's offset as soon as the listener returns for
      # it, rather than once per polled batch — after a crash, only the
      # message in flight is redelivered, not the rest of its batch.
      ack-mode: record

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

hashanchor:
  blockchain:
    # Defaults to the local Hardhat node (`npx hardhat node`, in contracts/).
    rpc-url: ${HASHANCHOR_RPC_URL:http://localhost:8545}
    # No defaults for these two — a missing env var should fail startup
    # loudly, not silently fall back to some placeholder key or address.
    private-key: ${HASHANCHOR_PRIVATE_KEY}
    contract-address: ${HASHANCHOR_CONTRACT_ADDRESS}
    # Transactions are signed for this chain only (EIP-155), so pointing
    # rpc-url at the wrong network gets them rejected, not executed. 31337
    # is the local Hardhat node; the amoy profile overrides it.
    chain-id: 31337
    # anchor() uses ~46,500 gas; this leaves about 2x headroom. The node
    # requires the sender to hold gas-limit x gas-price up front, so an
    # oversized limit costs balance even though unused gas is refunded.
    gas-limit: 100000
    # max-gas-price-gwei (unset = no cap) bounds the node's eth_gasPrice
    # suggestion; see NetworkGasProvider. Only the amoy profile needs it.
    # How long anchor() waits for a transaction receipt before giving up on
    # this attempt (see AnchorClient for why this must stay well under
    # Kafka's 5-minute max.poll.interval.ms).
    receipt-poll-interval: 500ms
    receipt-timeout: 30s
    # Blocks mined on top of the anchoring block before a record is marked
    # ANCHORED. 0 locally: the Hardhat node only mines a block when a
    # transaction arrives, so waiting for more would hang. The amoy profile
    # raises it. receipt-timeout + confirmation-timeout bounds one attempt,
    # and must stay under both max.poll.interval.ms and stale-after.
    confirmations: 0
    confirmation-timeout: 60s
  outbox:
    # How often OutboxRelay checks for unpublished events — the worst-case
    # delay between a submit and its event reaching Kafka.
    poll-interval: 5s
  anchoring:
    # A record in ANCHORING whose row hasn't been touched for this long is
    # considered abandoned (see StaleAnchoringRecovery). Comfortably longer
    # than one full retry cycle, so live work is never mistaken for stuck.
    stale-after: ${HASHANCHOR_STALE_AFTER:5m}
    stale-check-interval: 60s
